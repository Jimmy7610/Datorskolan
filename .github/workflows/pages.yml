name: Deploy Datorskolan to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check src/vfs.js
          node --check src/scenarios.js
          node --check src/scenario-engine.js
          node --check src/progress-store.js
          node --check src/lessons.js
          node --check src/lesson-engine.js
          node --check src/product-shell.js
          node --check src/app.js
          node --check tests/lesson-engine-smoke.js

      - name: Smoke test scenario engine
        run: |
          node -e "global.window={}; require('./src/scenarios.js'); require('./src/scenario-engine.js'); const e=new window.DatorskolanScenarioEngine(window.DatorskolanScenarios); if(e.list().length<12) process.exit(1);"

      - name: Smoke test Lesson Engine
        run: node tests/lesson-engine-smoke.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="" data-i18n-attr="content:meta.description">
  <meta name="theme-color" content="#f8fafc">
  <title data-i18n="meta.title">Datorskolan</title>
  <link rel="stylesheet" href="./styles/site.css">
  <link rel="stylesheet" href="./styles/fakewin.css">
  <script src="./src/i18n.js"></script>
  <script src="./locales/sv/ui.js"></script>
  <script src="./locales/en/ui.js"></script>
  <script src="./locales/sv/fakewin.js"></script>
  <script src="./locales/en/fakewin.js"></script>
</head>
<body class="landing-mode">
  <a class="skip-link" href="#landing-main" data-i18n="landing.skipToMain"></a>

  <div id="landing" class="site">
    <header class="site-header">
      <a class="brand" href="#" data-landing-tab="overview" data-i18n-attr="aria-label:landing.brandHome">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span class="brand-copy">
          <strong>Datorskolan</strong>
          <small data-i18n="landing.tagline"></small>
        </span>
      </a>

      <nav class="site-tabs" role="tablist" data-i18n-attr="aria-label:landing.tabsLabel">
        <button id="tab-overview" type="button" role="tab" aria-selected="true" aria-controls="panel-overview" tabindex="0" data-landing-tab="overview" data-i18n="landing.tab.overview"></button>
        <button id="tab-how" type="button" role="tab" aria-selected="false" aria-controls="panel-how" tabindex="-1" data-landing-tab="how" data-i18n="landing.tab.how"></button>
        <button id="tab-course" type="button" role="tab" aria-selected="false" aria-controls="panel-course" tabindex="-1" data-landing-tab="course" data-i18n="landing.tab.course"></button>
        <button id="tab-safe" type="button" role="tab" aria-selected="false" aria-controls="panel-safe" tabindex="-1" data-landing-tab="safe" data-i18n="landing.tab.safe"></button>
      </nav>

      <div class="site-header-actions">
        <div class="language-switch" role="group" aria-label="Språk / Language">
          <button type="button" lang="sv" data-set-locale="sv" aria-pressed="true">Svenska</button>
          <button type="button" lang="en" data-set-locale="en" aria-pressed="false">English</button>
        </div>
        <button class="button button-secondary" type="button" data-reset-school hidden data-i18n="landing.restart"></button>
        <button class="button button-primary header-cta" type="button" data-launch-school>
          <span data-cta-text></span>
        </button>
      </div>
    </header>

    <main id="landing-main" class="site-main" tabindex="-1">
      <section id="panel-overview" class="panel panel-overview" data-landing-panel="overview" role="tabpanel" aria-labelledby="tab-overview">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="landing.overview.eyebrow"></p>
          <h1>
            <span data-i18n="landing.overview.titleA"></span>
            <span class="accent" data-i18n="landing.overview.titleB"></span>
          </h1>
          <p class="lead" data-i18n="landing.overview.lead"></p>

          <div class="hero-actions">
            <button class="button button-primary button-large" type="button" data-launch-school>
              <span data-cta-text></span>
            </button>
            <button class="button button-secondary button-large" type="button" data-landing-tab="course" data-i18n="landing.overview.seeCourse"></button>
          </div>

          <p class="resume-note" data-resume-note role="status" hidden></p>

          <dl class="facts">
            <div><dt data-i18n="landing.fact.lessons"></dt><dd data-course-count="lessons"></dd></div>
            <div><dt data-i18n="landing.fact.modules"></dt><dd data-course-count="modules"></dd></div>
            <div><dt data-i18n="landing.fact.risk"></dt><dd>0</dd></div>
          </dl>
        </div>

        <figure class="hero-visual" aria-hidden="true">
          <div class="preview-screen">
            <div class="preview-window">
              <div class="preview-titlebar">
                <img src="./assets/icons/fluent/folder.svg" alt="">
                <span data-i18n="app.explorer"></span>
                <i></i><i></i><i></i>
              </div>
              <div class="preview-body">
                <div class="preview-nav">
                  <span><img src="./assets/icons/fluent/home.svg" alt=""><b data-i18n="vfs.home"></b></span>
                  <span class="is-active"><img src="./assets/icons/fluent/folder.svg" alt=""><b data-i18n="vfs.documents"></b></span>
                  <span><img src="./assets/icons/fluent/download.svg" alt=""><b data-i18n="vfs.downloads"></b></span>
                  <span><img src="./assets/icons/fluent/image-multiple.svg" alt=""><b data-i18n="vfs.pictures"></b></span>
                </div>
                <div class="preview-files">
                  <span><img src="./assets/icons/fluent/folder.svg" alt=""><b data-i18n="landing.preview.folder"></b></span>
                  <span class="is-selected"><img src="./assets/icons/fluent/document-text.svg" alt=""><b data-i18n="landing.preview.file"></b></span>
                  <span><img src="./assets/icons/fluent/document-pdf.svg" alt=""><b data-i18n="landing.preview.pdf"></b></span>
                </div>
              </div>
            </div>
            <div class="preview-coach">
              <strong data-i18n="landing.preview.coachTitle"></strong>
              <span data-i18n="landing.preview.coachText"></span>
            </div>
            <div class="preview-taskbar">
              <img src="./assets/icons/fluent/apps.svg" alt="">
              <img src="./assets/icons/fluent/folder.svg" alt="">
              <img src="https://www.google.com/chrome/static/images/chrome-logo-m100.svg" alt="">
              <img src="./assets/icons/fluent/settings.svg" alt="">
              <img src="./assets/icons/fluent/mail.svg" alt="">
            </div>
          </div>
        </figure>
      </section>

      <section id="panel-how" class="panel panel-how" data-landing-panel="how" role="tabpanel" aria-labelledby="tab-how" hidden>
        <header class="panel-heading">
          <p class="eyebrow" data-i18n="landing.how.eyebrow"></p>
          <h2 data-i18n="landing.how.title"></h2>
          <p class="lead" data-i18n="landing.how.lead"></p>
        </header>

        <ol class="step-grid">
          <li class="card">
            <span class="step-number" aria-hidden="true">1</span>
            <img class="card-icon" src="./assets/icons/fluent/document-text.svg" alt="">
            <h3 data-i18n="landing.how.step1.title"></h3>
            <p data-i18n="landing.how.step1.text"></p>
          </li>
          <li class="card">
            <span class="step-number" aria-hidden="true">2</span>
            <img class="card-icon" src="./assets/icons/fluent/image.svg" alt="">
            <h3 data-i18n="landing.how.step2.title"></h3>
            <p data-i18n="landing.how.step2.text"></p>
          </li>
          <li class="card">
            <span class="step-number" aria-hidden="true">3</span>
            <img class="card-icon" src="./assets/icons/fluent/desktop.svg" alt="">
            <h3 data-i18n="landing.how.step3.title"></h3>
            <p data-i18n="landing.how.step3.text"></p>
          </li>
          <li class="card">
            <span class="step-number" aria-hidden="true">4</span>
            <img class="card-icon" src="./assets/icons/fluent/sync.svg" alt="">
            <h3 data-i18n="landing.how.step4.title"></h3>
            <p data-i18n="landing.how.step4.text"></p>
          </li>
        </ol>

        <div class="callout">
          <div>
            <h3 data-i18n="landing.how.realTitle"></h3>
            <p data-i18n="landing.how.realText"></p>
          </div>
          <ul class="pill-list">
            <li><img src="./assets/icons/fluent/apps.svg" alt=""><span data-i18n="landing.how.pill.pin"></span></li>
            <li><img src="./assets/icons/fluent/folder-zip.svg" alt=""><span data-i18n="landing.how.pill.zip"></span></li>
            <li><img src="./assets/icons/fluent/wifi.svg" alt=""><span data-i18n="landing.how.pill.wifi"></span></li>
            <li><img src="./assets/icons/fluent/usb-plug.svg" alt=""><span data-i18n="landing.how.pill.usb"></span></li>
          </ul>
        </div>
      </section>

      <section id="panel-course" class="panel panel-course" data-landing-panel="course" role="tabpanel" aria-labelledby="tab-course" hidden>
        <header class="panel-heading panel-heading-row">
          <div>
            <p class="eyebrow" data-course-eyebrow></p>
            <h2 data-i18n="landing.course.title"></h2>
          </div>
          <p class="lead" data-i18n="landing.course.lead"></p>
        </header>

        <ul class="module-grid" data-module-grid></ul>

        <div class="course-footer">
          <p data-i18n="landing.course.extras"></p>
          <button class="button button-primary" type="button" data-launch-school><span data-cta-text></span></button>
        </div>
      </section>

      <section id="panel-safe" class="panel panel-safe" data-landing-panel="safe" role="tabpanel" aria-labelledby="tab-safe" hidden>
        <div class="safe-copy">
          <p class="eyebrow" data-i18n="landing.safe.eyebrow"></p>
          <h2 data-i18n="landing.safe.title"></h2>
          <p class="lead" data-i18n="landing.safe.lead"></p>
          <button class="button button-primary button-large" type="button" data-launch-school><span data-cta-text></span></button>
        </div>

        <ul class="check-list">
          <li><span class="check" aria-hidden="true"></span><div><h3 data-i18n="landing.safe.item1.title"></h3><p data-i18n="landing.safe.item1.text"></p></div></li>
          <li><span class="check" aria-hidden="true"></span><div><h3 data-i18n="landing.safe.item2.title"></h3><p data-i18n="landing.safe.item2.text"></p></div></li>
          <li><span class="check" aria-hidden="true"></span><div><h3 data-i18n="landing.safe.item3.title"></h3><p data-i18n="landing.safe.item3.text"></p></div></li>
          <li><span class="check" aria-hidden="true"></span><div><h3 data-i18n="landing.safe.item4.title"></h3><p data-i18n="landing.safe.item4.text"></p></div></li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p data-i18n="landing.footer.note"></p>
      <button class="link-button" type="button" data-open-privacy data-i18n="landing.footer.privacy"></button>
    </footer>
  </div>

  <div class="modal-backdrop" data-modal="reset" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title" aria-describedby="reset-description">
      <h2 id="reset-title" data-i18n="reset.title"></h2>
      <p id="reset-description" data-i18n="reset.description"></p>
      <p class="modal-warning" data-i18n="reset.warning"></p>
      <div class="modal-actions">
        <button type="button" class="button button-secondary" data-modal-close data-i18n="common.cancel"></button>
        <button type="button" class="button button-danger" data-reset-confirm data-i18n="reset.confirm"></button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" data-modal="privacy" hidden>
    <section class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="privacy-title">
      <h2 id="privacy-title" data-i18n="privacy.title"></h2>
      <p data-i18n="privacy.intro"></p>
      <ul class="plain-list">
        <li data-i18n="privacy.item.noAccount"></li>
        <li data-i18n="privacy.item.noTracking"></li>
        <li data-i18n="privacy.item.localStorage"></li>
        <li data-i18n="privacy.item.thirdParty"></li>
        <li data-i18n="privacy.item.delete"></li>
      </ul>
      <div class="modal-actions">
        <button type="button" class="button button-primary" data-modal-close data-i18n="common.close"></button>
      </div>
    </section>
  </div>

  <main id="app" hidden tabindex="-1" data-i18n-attr="aria-label:app.simulatorLabel"></main>

  <script defer src="./locales/sv/course.js"></script>
  <script defer src="./locales/en/course.js"></script>
  <script defer src="./src/course/lessons.js"></script>
  <script defer src="./src/course/scenarios.js"></script>
  <script defer src="./src/course.js"></script>
  <script defer src="./src/vfs.js"></script>
  <script defer src="./src/scenario-engine.js"></script>
  <script defer src="./src/progress-store.js"></script>
  <script defer src="./src/lesson-engine.js"></script>
  <script defer src="./src/win11-ui.js"></script>
  <script defer src="./src/explorer-app.js"></script>
  <script defer src="./src/basic-apps.js"></script>
  <script defer src="./src/mouse-lab.js"></script>
  <script defer src="./src/advanced-apps.js"></script>
  <script defer src="./src/everyday-apps.js"></script>
  <script defer src="./src/chrome-app.js"></script>
  <script defer src="./src/settings-app.js"></script>
  <script defer src="./src/pdf-app.js"></script>
  <script defer src="./src/installer-app.js"></script>
  <script defer src="./src/snipping-app.js"></script>
  <script defer src="./src/trouble-app.js"></script>
  <script defer src="./src/learning-panel.js"></script>
  <script defer src="./src/app.js"></script>
  <script defer src="./src/product-shell.js"></script>
</body>
</html>
